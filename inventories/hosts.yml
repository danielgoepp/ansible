# Ansible Inventory - converted from ~/.ansible/hosts
all:

  vars:
    ansible_user: dang

  hosts:

    localhost:
      ansible_connection: local

  children:

    pve:
      hosts:
        pve11:
        pve12:
        pve13:
        pve15:
      vars:
        ansible_user: root

    ubuntu:
      vars:
        # aes256k CephFS key; needs upstream ceph-common (Ubuntu's 19.2.3 can't parse it)
        ceph_upstream_release: tentacle
        ceph_client_name: cephfs-ubuntu
        ceph_secret_file: cephfs-ubuntu.secret
      hosts:
        ui-network:
        backup:
        dev:
        adambalm:
          # amdgpu load + VRAM (temp/power/fan already come from hwmon)
          node_exporter_extra_collectors: ['drm']
        gru:
        hermes:

    rpi:
      hosts:
        rockyledge:
          services: ['nut']
        morgspi:
          services: ['nut', 'homeassistant']
        mudderpi:
          services: ['nut', 'homeassistant']
        probepi:
        magpi:
        # voicepi-greatroom:
        #   services: ['wyoming']
        #   wyoming_satellite_name: "Greatroom Satellite"

    k3s_prod:
      hosts:
        k3s-prod-11:
        k3s-prod-12:
        k3s-prod-13:
        k3s-prod-15:

    lxc:
      hosts:
        smb:
          # Ubuntu 24.04 on a 7.0 PVE kernel; same aes256k CephFS setup as the ubuntu group
          ceph_upstream_release: tentacle
          ceph_client_name: cephfs-ubuntu
          ceph_secret_file: cephfs-ubuntu.secret

    ui_protect:
      hosts:
        ui-protect:
          ansible_host: ui-protect.goepp.net
          ansible_user: root
