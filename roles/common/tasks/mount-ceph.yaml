---
# Ceph user and secret file are overridable per host (e.g. to move a host to a
# new aes256k key); defaults keep the shared ubuntu-vault user
- name: Set Ceph client user and secret file
  ansible.builtin.set_fact:
    ceph_client: "{{ ceph_client_name | default('ubuntu-vault') }}"
    ceph_secret: "{{ ceph_secret_file | default('ceph-vault.secret') }}"

# Distro ceph-common may be too old for the cluster (e.g. Ubuntu 24.04's 19.2.3
# mount.ceph can't parse aes256k keys); set ceph_upstream_release (e.g. tentacle)
# on a host to install ceph-common from download.ceph.com instead
# Plain get_url + copy rather than deb822_repository, which needs python3-debian
# on the host and can't run in check mode without it
- name: Add upstream Ceph signing key
  ansible.builtin.get_url:
    url: https://download.ceph.com/keys/release.asc
    dest: /etc/apt/keyrings/ceph.asc
    mode: '0644'
  when: ceph_upstream_release is defined

- name: Add upstream Ceph repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.sources
    content: |
      Components: main
      X-Repolib-Name: ceph
      Signed-By: /etc/apt/keyrings/ceph.asc
      Suites: {{ ansible_distribution_release }}
      Types: deb
      URIs: https://download.ceph.com/debian-{{ ceph_upstream_release }}
    mode: '0644'
  when: ceph_upstream_release is defined

- name: Install ceph-common from upstream Ceph repository
  ansible.builtin.apt:
    name: ceph-common
    state: latest
    update_cache: true
  when: ceph_upstream_release is defined

# Raspberry Pis mount /mnt/backups from smb instead (mount-smb.yaml)
- name: Set Ceph mount parameters
  ansible.builtin.set_fact:
    ceph_src_format: "{{ ceph_client }}@851299c9-d4fb-4042-89e8-23e838351f4e.ceph-ssd="
    ceph_opts_base: "mon_addr=10.1.11.11:6789/10.1.11.12:6789/10.1.11.13:6789,secretfile=/etc/ceph/{{ ceph_secret }},rw,noatime,_netdev"

- name: Copy Ceph secret
  ansible.builtin.copy:
    src: "ceph/{{ ceph_secret }}"
    dest: "/etc/ceph/{{ ceph_secret }}"
    decrypt: true
    owner: root
    group: root
    mode: '0640'
  when: ansible_hostname != 'adambalm' and ansible_hostname != 'gru'

- name: Create /mnt/k3s-prod-data
  ansible.builtin.file:
    path: /mnt/k3s-prod-data
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Mount ceph /mnt/k3s-prod-data
  ansible.posix.mount:
    src: "{{ ceph_src_format }}/k3s-prod-data"
    path: /mnt/k3s-prod-data
    state: mounted
    fstype: ceph
    opts: "{{ ceph_opts_base }}"

- name: Create /mnt/k3s-lab-data
  ansible.builtin.file:
