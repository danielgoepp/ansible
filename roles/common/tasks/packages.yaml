---
- name: Install default global packages
  ansible.builtin.apt:
    name:
      # Basic tools
      - iftop
      - htop
      - unzip
      - zsh
      - vim
      - ncdu
      - keyutils ## what is this for?
      - acl ## what is this for?
      # Monitoring tools
      - prometheus-node-exporter
      # File system tools
      - nfs-common ## this can be removed?
      - ceph-common
      - cifs-utils
      # Development tools
      - git
      - gh
      - build-essential
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

# Enable optional node_exporter collectors per host, e.g. in the inventory:
#   node_exporter_extra_collectors: ['drm']
- name: Configure extra node_exporter collectors
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: >-
      ARGS="{{ node_exporter_extra_collectors | map('regex_replace', '^', '--collector.') | join(' ') }}"
  when: node_exporter_extra_collectors | default([]) | length > 0
  notify: Restart prometheus-node-exporter
