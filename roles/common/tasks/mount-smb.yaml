---
- name: Set CIFS credentials variables
  ansible.builtin.set_fact:
    cifs_user: "{{ awx_cifs_username | default(vault_cifs_username) }}"
    cifs_pass: "{{ awx_cifs_password | default(vault_cifs_password) }}"
  when: ansible_hostname != 'adambalm'

- name: Create CIFS credentials file
  ansible.builtin.copy:
    content: |
      username={{ cifs_user }}
      password={{ cifs_pass }}
    dest: /etc/smb_cifs_credentials
    owner: root
    group: root
    mode: '0600'
  when: ansible_hostname != 'adambalm'

- name: Create smb media directory
  ansible.builtin.file:
    path: /mnt/smb_media
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname in groups['k3s_prod']

- name: Mount smb media directory
  ansible.posix.mount:
    src: //smb.goepp.net/media
    path: /mnt/smb_media
    state: mounted
    fstype: cifs
    opts: credentials=/etc/smb_cifs_credentials
  when: inventory_hostname in groups['k3s_prod']

- name: Create smb kopia-hdd directory
  ansible.builtin.file:
    path: /mnt/kopia-hdd
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname in groups['k3s_prod']

- name: Mount smb kopia-hdd directory
  ansible.posix.mount:
    src: //smb.goepp.net/kopia-hdd
    path: /mnt/kopia-hdd
    state: mounted
    fstype: cifs
    opts: credentials=/etc/smb_cifs_credentials
  when: inventory_hostname in groups['k3s_prod']

# Raspberry Pis get /mnt/backups from smb instead of CephFS (their kernels can't
# use aes256k Ceph keys). The share forces root:root 0644/0755 on the smb side.
# IP rather than smb.goepp.net: the remote Pis resolve via Tailscale MagicDNS,
# which doesn't serve goepp.net
- name: Create smb backups directory
  ansible.builtin.file:
    path: /mnt/backups
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname in groups['rpi'] and inventory_hostname != 'probepi'

- name: Mount smb backups directory
  ansible.posix.mount:
    src: //10.1.11.106/backups
    path: /mnt/backups
    state: mounted
    fstype: cifs
    opts: credentials=/etc/smb_cifs_credentials,_netdev,nofail
  when: inventory_hostname in groups['rpi'] and inventory_hostname != 'probepi'
